name: docs-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Markdown links (offline)
        uses: lycheeverse/lychee-action@f25a3a9f25bd5f4c5d77189cab02ff357b5aedeb # v2.4.1
        with:
          args: --offline --no-progress --include-fragments '**/*.md'
          fail: true
