# Context windows of Bedrock model families, used when a Bedrock backend has no configured
# `context_window` (Bedrock's API does not report one). Keys are model-id prefixes; the longest
# matching prefix wins. Cross-Region inference profile ids ("us.", "eu.", "apac.", "global."...)
# are matched without their geography prefix, so "us.anthropic.claude-sonnet-5-5" matches
# "anthropic.claude". A model that matches nothing falls back to 8192 tokens and the connection
# test says so; set the backend's context window in Settings for it.
#
# Values are deliberately the SMALLEST window of the family, not the largest: a smaller window
# only means a very long meeting is summarised in parts, while a too-large one fails the call.
# Claude is capped at 200k even where a model card offers 1M, so prompts stay out of the
# long-context price tiers some models bill above 100k-200k input tokens.
#
# Checked against the AWS Bedrock model cards on 2026-10-15 (ADR-0044). Edit freely; this file is
# data, not code.
#
# `prices` (Phase 15h, ADR-0042): on-demand USD per 1M input and output tokens by the same
# longest-prefix rule, in us-east-1, shown in the model pickers with the `prices_as_of` date and a
# "may be out of date" note after 180 days. A family that is not listed simply shows no price.
# To update: read the figures from https://aws.amazon.com/bedrock/pricing/, edit the rows, set
# `prices_as_of` to the day you checked. Haiku 5.5 bills prompts above 100k tokens at the
# long-context rate (0.50/2.50), which the app avoids by capping Claude windows at 200k.
version: 1
checked: 2026-10-15
context_windows:
  anthropic.claude: 200000          # Claude 3 Haiku through the 5.5 family: 200k or more
  amazon.nova-micro: 128000
  amazon.nova-lite: 300000
  amazon.nova-pro: 300000
  amazon.nova-premier: 1000000
  amazon.nova: 128000               # other Nova models (Nova 2...): smallest known window
  amazon.titan-text-premier: 32000
  amazon.titan-text-express: 8192
  amazon.titan-text-lite: 4096
  meta.llama3-8b: 8192              # Llama 3.0
  meta.llama3-70b: 8192
  meta.llama3: 128000               # Llama 3.1, 3.2, 3.3
  meta.llama4: 128000               # Llama 4 Scout/Maverick have more; 128k is the safe floor
  mistral.mistral-large-2407: 128000
  mistral.pixtral-large: 128000
  mistral: 32000                    # Mistral 7B, Mixtral, Mistral Large (2402), Small
  cohere.command-r: 128000
  ai21.jamba: 256000
  deepseek: 128000
  openai.gpt-oss: 128000
  qwen: 32000
prices_as_of: 2026-10-15
prices:                             # USD per 1M tokens; Anthropic list prices, same on Bedrock
  anthropic.claude-haiku-5-5: {in: 0.10, out: 0.50}
  anthropic.claude-sonnet-5-5: {in: 2.00, out: 10.00}
  anthropic.claude-opus-5-5: {in: 4.00, out: 20.00}
