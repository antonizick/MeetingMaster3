{% extends "base.html" %}
{% block title %}Something went wrong · MeetingMaster3{% endblock %}
{% block content %}
<h1>Something went wrong</h1>
<div class="alert error" role="alert">
  <p><strong>{{ error.message }}</strong></p>
  {% if error.hint %}<p>{{ error.hint }}</p>{% endif %}
  <p class="muted"><code>{{ error.code }}</code></p>
</div>
<p><a class="button" href="/">Back to the start</a></p>
{% endblock %}
