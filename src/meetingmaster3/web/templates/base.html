<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="htmx-config" content='{"allowEval": false, "allowScriptTags": false, "includeIndicatorStyles": false, "selfRequestsOnly": true, "historyCacheSize": 0}'>
  <title>{% block title %}MeetingMaster3{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="/">MeetingMaster3</a>
    <nav aria-label="Main">
      <ul>
        {% for key, href, label in nav %}
        <li><a href="{{ href }}"{% if key == active %} aria-current="page"{% endif %}>{{ label }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </header>
  <div id="toasts" class="toasts"></div>
  <main id="main" tabindex="-1" class="{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
  <p id="live-status" class="sr-only" role="status" aria-live="polite"></p>
  <footer class="site-footer">v{{ version }} · local-first · nothing leaves this machine unless you choose a cloud model</footer>
  <script defer src="{{ url_for('static', path='vendor/htmx/htmx.min.js') }}"></script>
  {% block scripts %}{% endblock %}
  <script defer src="{{ url_for('static', path='app.js') }}"></script>
  <script defer src="{{ url_for('static', path='vendor/alpine/alpine-csp.min.js') }}"></script>
</body>
</html>
