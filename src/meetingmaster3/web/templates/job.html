{% extends "base.html" %}
{# Meeting pages: no logo, the space is for the meeting (Phase 15a). #}
{% block brand_logo %}{% endblock %}
{% block title %}{{ tab_title }}{% endblock %}
{% block content %}
<div id="job-panel" data-job-id="{{ job.id }}" data-final="{{ 'true' if final else 'false' }}"
     data-events-url="/api/jobs/{{ job.id }}/events"
     hx-get="/ui/jobs/{{ job.id }}/panel" hx-trigger="mm3:refresh" hx-swap="innerHTML">
  {% include "partials/job_panel.html" %}
</div>
{% endblock %}
