turns:
  - [0, SPEAKER_00, "Thanks for coming in, Tessa. I'm Helen, I lead support, and Ravi here is one of our senior engineers. Today is a first-round interview for the support engineer role."]
  - [12, SPEAKER_02, "Thanks for having me. I've spent six years in support at a logistics software company, the last two as a tier-two engineer."]
  - [24, SPEAKER_01, "Tell us about a hard incident you handled recently."]
  - [30, SPEAKER_02, "Last spring a customer's nightly sync started duplicating shipments. I reproduced it with their exported config, traced it to a retry bug in our queue worker, wrote the workaround for the customer the same day and filed the fix with the logs attached. It was patched in two days."]
  - [52, SPEAKER_01, "How do you work with developers when you escalate?"]
  - [57, SPEAKER_02, "I write the ticket so a developer never has to ask me a question: steps, expected result, actual result, logs. I also follow up after the fix to check the customer is happy."]
  - [74, SPEAKER_00, "Do you have experience with SQL or scripting?"]
  - [79, SPEAKER_02, "I write SQL queries daily for diagnosing data problems. Scripting is weaker. I've done small Python scripts but nothing I'd call production code, and I haven't used your monitoring tool."]
  - [96, SPEAKER_00, "Fair enough. Are you planning to have kids soon? We want to know whether you'd be available for the on-call rota."]
  - [104, SPEAKER_02, "I'd rather talk about the rota itself. I'm happy to take part in on-call and I've done it for four years."]
  - [114, SPEAKER_00, "Understood, sorry about that. How do you handle an angry customer?"]
  - [121, SPEAKER_02, "I acknowledge the problem first, say exactly what I'll do and by when, and then do it. If I can't solve it, I tell them who can and hand over properly."]
  - [138, SPEAKER_02, "Can I ask about training? And how the team handles a bad week of tickets?"]
  - [145, SPEAKER_00, "We have a six-week onboarding plan, and we rotate the queue so nobody has the hardest tickets all week."]
  - [156, SPEAKER_01, "We'll discuss with the team and let you know. Helen will email you by next Wednesday about a second round with the engineering manager."]
  - [168, SPEAKER_00, "I'll send that email. Thanks, Tessa."]
