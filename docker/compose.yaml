# MeetingMaster3: GPU deployment (NVIDIA). Run from the repository root:
#   export MM3_VAULT_PATH=/path/to/your/obsidian/vault
#   docker compose -f docker/compose.yaml up -d --build
# CPU only:            add  -f docker/compose.cpu.yaml
# Host Ollama (127.0.0.1-only): add  -f docker/compose.host-network.yaml   (see docs/user-guide/install-docker.md)
# Bundled Ollama:      add  --profile ollama
name: meetingmaster3

services:
  meetingmaster3:
    image: meetingmaster3:gpu
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime-gpu
      args:
        MM3_UID: ${MM3_UID:-1000}
        MM3_GID: ${MM3_GID:-1000}
    user: "${MM3_UID:-1000}:${MM3_GID:-1000}"
    # Published on the host's loopback only (SECURITY.md S1). The app inside binds 0.0.0.0
    # because Docker's bridge cannot reach a container's 127.0.0.1; the port mapping is the guard.
    ports:
      - "127.0.0.1:${MM3_PORT:-8765}:8765"
    environment:
      MM3_VAULT__PATH: /vault
      # Backend "ollama" on the host (override with compose.host-network.yaml for a 127.0.0.1-only Ollama)
      MM3_LLM__BACKENDS__OLLAMA__KIND: ollama
      MM3_LLM__BACKENDS__OLLAMA__BASE_URL: ${MM3_OLLAMA_URL:-http://host.docker.internal:11434}
    # Every variable in the repository's .env reaches the app, including cloud keys
    # (MM3_SECRETS__AWS_ACCESS_KEY_ID / _SECRET_ACCESS_KEY, MM3_SECRETS__OPENROUTER_API_KEY;
    # docs/user-guide/install-docker.md "Cloud backends"). Keys typed in Settings are kept in
    # the mm3-config volume instead.
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ${MM3_VAULT_PATH:?set MM3_VAULT_PATH to your Obsidian vault folder}:/vault
      - mm3-config:/config
      - mm3-data:/data
      - mm3-models:/models
      # Bedrock with an AWS profile instead of access keys: uncomment, and set the backend's
      # "AWS profile". Read-only; the container's HOME is /tmp. SSO profiles need a fresh
      # `aws sso login` on the host when their session expires.
      # - ${HOME}/.aws:/tmp/.aws:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: false   # tini is PID 1 inside the image
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Optional: a private Ollama in Docker (docker compose --profile ollama up). It shares the same
  # GPU and its 8 GB of VRAM with the transcriber (spec R5); MeetingMaster3 unloads Ollama models
  # before transcription only when the URL is local, which it is for this service name only if you
  # set MM3_OLLAMA_URL=http://host.docker.internal:11434 and publish the port, so prefer the host Ollama.
  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.40.7   # pinned: the version MeetingMaster3 was tested with on the host (bump deliberately)
    environment:
      # Flash attention + an 8-bit context cache: about 1 GB less VRAM for a 12-16k context, so
      # more of an 8B model stays on an 8 GB GPU (measured 1.5-1.8x faster; docs/user-guide/hardware.md).
      # Where flash attention is unsupported (some CPUs and old GPUs) Ollama keeps the f16 cache.
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
    volumes:
      - mm3-ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  mm3-config:
  mm3-data:
  mm3-models:
  mm3-ollama:
